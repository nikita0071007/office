    default: box(g, .1, 0, .1, Math.max(.2, W - .2), .9, Math.max(.2, D - .2), "#8a7a6a");
  }
}
function shade(hex, f = .75) { const c = new THREE.Color(hex); c.multiplyScalar(f); return "#" + c.getHexString(); }

// ---------- сотрудники ----------
const agents = {};
function makeAgent(k) {
  const L = LOOK[k], skin = SKIN[L.skin], g = new THREE.Group(); g.scale.setScalar(1.15); const  top = L.top, bot = L.bot || "#333";
  const body = new THREE.Group(); g.add(body);
  box(body, -.19, 0, -.1, .15, .5, .2, bot); box(body, .04, 0, -.1, .15, .5, .2, bot);
  if (L.robe || L.dress) box(body, -.24, .12, -.16, .48, .5, .32, top);
  box(body, -.22, .48, -.13, .44, .56, .26, top);
  box(body, -.34, .5, -.08, .12, .5, .16, top); box(body, .22, .5, -.08, .12, .5, .16, top);
  ball(body, -.28, .48, 0, .07, skin); ball(body, .28, .48, 0, .07, skin);
  ball(body, 0, 1.28, 0, .19, skin);
  const hairC = L.hair; if (L.hs !== "bald") { const h = new THREE.Mesh(new THREE.SphereGeometry(.205, 12, 8, 0, Math.PI * 2, 0, Math.PI * (L.hs === "cap" ? .42 : .55)), mat(hairC)); h.position.set(0, 1.31, -.01); h.castShadow = true; body.add(h);
    if (L.hs === "long" || L.hs === "bob") box(body, -.2, 1.0, -.2, .4, .38, .12, hairC); if (L.hs === "pony") ball(body, 0, 1.2, -.24, .1, hairC); if (L.hs === "bun") ball(body, 0, 1.52, -.05, .1, hairC); }
  box(body, -.07, 1.28, .17, .04, .04, .03, "#1b2530"); box(body, .03, 1.28, .17, .04, .04, .03, "#1b2530");
  if (L.glasses) box(body, -.1, 1.26, .185, .2, .06, .015, "#2b2b33");
  if (L.beard) box(body, -.1, 1.08, .12, .2, .12, .1, L.beard);
  if (L.hood) box(body, -.2, .95, -.18, .4, .12, .1, shade(top, .8));
  if (L.badge) box(body, .06, .85, .13, .08, .08, .02, "#f2c14e");
  if (L.phones) box(body, -.2, 1.34, -.02, .4, .05, .06, "#222");
  g.userData = {k, body}; g.traverse(m => { if (m.isMesh) m.userData.agent = k; });
  const ring = new THREE.Mesh(new THREE.RingGeometry(.28, .36, 24), new THREE.MeshBasicMaterial({color: "#999", transparent: true, opacity: .9, side: THREE.DoubleSide, depthTest: false})); ring.rotation.x = -Math.PI / 2; ring.position.y = .03; ring.renderOrder = 5; g.add(ring); g.userData.ring = ring;
  const nm = TEAM[k].short || TEAM[k].name, sp = textSprite(nm, "#fff", "rgba(18,20,32,.82)", 34); sp.position.y = 1.95; g.add(sp);

}
const SEAT_Y = .02;
function place(k, phase) {
  const a = agents[k], b = a.g.userData.body; a.g.rotation.set(0, 0, 0); b.position.set(0, 0, 0); b.rotation.set(0, 0, 0);
  if (phase === "night" && BEDS[k]) { const [f, x, y] = BEDS[k]; a.floor = f; a.g.position.set(x + .5, (f - 1) * FH + .62, y + 1); a.g.rotation.x = -Math.PI / 2; a.g.userData.ring.visible = false; a.sleep = true; return; }
  a.sleep = false; a.g.userData.ring.visible = true; const s = SEATS[k]; if (!s) return; const [f, x, y, face] = s; a.floor = f;
  a.g.position.set(x + .5, (f - 1) * FH + SEAT_Y, y + .5 + (face === "back" ? -.05 : .05)); a.g.rotation.y = face === "back" ? Math.PI : 0;
  const sitting = !(k === "guard" && false); if (sitting) { b.position.y = -.05; b.children[0].scale.y = .55; b.children[1].scale.y = .55; }
}

// ---------- сборка ----------
for (const f of [1, 2, 3]) buildFloor(f);
for (const f of [1, 2, 3]) for (const o of FL[f].furn) furn(f, o, floorGroups[f]);
// лампы ночью
if (NIGHT) for (const f of [1, 2, 3]) for (const [x, y] of LAMPS[f]) { const l = new THREE.PointLight("#ffd9a0", 7, 9, 1.6); l.position.set(x + .5, (f - 1) * FH + 2, y + .5); scene.add(l); }
for (const k in TEAM) { const g = makeAgent(k); agents[k] = {k, g, status: "idle", task: ""}; scene.add(g); place(k, NIGHT ? "night" : "day"); }

// ---------- данные ----------
const DEMO_ST = {poster: ["working", "Пишу подпись к рилсу"], editor: ["working", "Монтирую рилс · 64%"], critic: ["working", "Вычитываю текст"], video: ["waiting", "Урок готов — жду вашего «да»"], archivist: ["error", "Google Диск недоступен"], guard: ["working", "Смотрю камеры"], analyst: ["idle", "Разбираю статистику"]};
function apply(d) { for (const k in agents) { const v = (d.agents || {})[k] || {}, a = agents[k]; a.status = v.status || "idle"; a.task = v.task || ""; a.last = v.last_run; paint(a); }
  const ac = d.account || {}; if (ac.followers != null) document.getElementById("sub").textContent = `подписчиков: ${ac.followers} · крутите пальцем, нажмите на сотрудника`; }
const SC = {working: "#5de08a", waiting: "#f2c14e", error: "#ff6b6b", idle: "#8995a3"}, SL = {working: "Работает", waiting: "Ждёт вас", error: "Нужна помощь", idle: "Отдыхает"};
function paint(a) { a.g.userData.ring.material.color.set(SC[a.status] || SC.idle); }
async function load() { if (DEMO) { apply({agents: Object.fromEntries(Object.entries(DEMO_ST).map(([k, [s, t]]) => [k, {status: s, task: t}]))}); return; }
  try { const r = await fetch("status.json?t=" + Date.now(), {cache: "no-store"}); if (r.ok) apply(await r.json()); } catch (e) {} }
load(); setInterval(load, 60000);

// ---------- этажи-кнопки и камера ----------
let SHOW = 0; const btns = document.getElementById("floors");
function view(n) { SHOW = n; for (const f of [1, 2, 3]) { floorGroups[f].visible = n === 0 || n === f; (labelSprites[f] || []).forEach(s => s.visible = n !== 0); }
  for (const k in agents) agents[k].g.visible = n === 0 || agents[k].floor === n;
  [...btns.children].forEach((b, i) => b.classList.toggle("on", [0, 3, 2, 1][i] === n));
  const cy = n === 0 ? FH : (n - 1) * FH, tgt = new THREE.Vector3(14, cy, 8);
  const pos = n === 0 ? innerWidth < 700 ? new THREE.Vector3(14 + 20, 46, 8 + 40) : new THREE.Vector3(14 + 22, 32, 8 + 30) : new THREE.Vector3(14 + 9, (n - 1) * FH + 20, 8 + 15);
  anim = {t: 0, from: camera.position.clone(), to: pos, tf: controls.target.clone(), tt: tgt}; }
let anim = null;
for (const [n, t] of [[0, "🏢 Всё"], [3, "3 · Офис"], [2, "2 · Квартиры"], [1, "1 · Холл"]]) { const b = document.createElement("button"); b.textContent = t; b.onclick = () => view(n); btns.appendChild(b); }
camera.position.set(36, 32, 38); controls.target.set(14, FH, 8); view(0); anim = null; camera.position.set(36, 32, 38); controls.target.set(14, FH, 8);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); if (innerWidth < 700) camera.fov = 58; else camera.fov = 42; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
if (innerWidth < 700) { camera.position.set(34, 52, 50); controls.target.set(14, FH - 1, 8); }

// ---------- клик ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let down = null; const card = document.getElementById("card");
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(Object.values(agents).filter(a => a.g.visible).map(a => a.g), true).filter(h => h.object.userData.agent);
  if (!hits.length) { card.style.display = "none"; return; } const a = agents[hits[0].object.userData.agent], t = TEAM[a.k];
  document.getElementById("cn").textContent = t.name; document.getElementById("cr").textContent = t.role + " · " + t.room;
  const st = document.getElementById("cs"); st.textContent = a.sleep ? "Спит" : (SL[a.status] || "Отдыхает"); st.style.background = a.sleep ? "#8995a3" : (SC[a.status] || SC.idle);
  document.getElementById("ct").textContent = a.task || ""; card.style.display = "block"; });
document.getElementById("cx").onclick = () => card.style.display = "none";

// ---------- цикл ----------
const clock = new THREE.Clock();
function tick() { const dt = clock.getDelta(), t = clock.elapsedTime;
  if (anim) { anim.t = Math.min(1, anim.t + dt / 1.1); const e = anim.t < .5 ? 2 * anim.t * anim.t : 1 - Math.pow(-2 * anim.t + 2, 2) / 2; camera.position.lerpVectors(anim.from, anim.to, e); controls.target.lerpVectors(anim.tf, anim.tt, e); if (anim.t >= 1) anim = null; }
  for (const k in agents) { const a = agents[k]; if (a.sleep) { a.g.userData.body.position.y = Math.sin(t * 1.3 + k.length) * .015; continue; }
    const b = a.g.userData.body; if (a.status === "working") { b.rotation.x = Math.sin(t * 6 + k.length) * .02; b.position.y = -.05 + Math.abs(Math.sin(t * 8 + k.length)) * .012; } else b.rotation.x = 0; }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(tick); }
document.getElementById("load").style.display = "none"; tick();
window.__ready = true;
</script>
