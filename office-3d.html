<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17212b">
  <title>Офис агентов — обзор</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #edf2f4;
      --muted: #b1bcc4;
      --accent: #8ecbc1;
      --panel: rgba(23, 33, 43, .86);
      --line: rgba(229, 238, 242, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17212b;
      color: var(--ink);
      font: 14px/1.5 "Manrope", "Segoe UI", system-ui, sans-serif;
    }

    button, a { font: inherit; }

    .scene {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 52% 32%, rgba(181, 199, 196, .2), transparent 42%),
        linear-gradient(160deg, #263845, #111a21 80%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging { cursor: grabbing; }

    .topbar {
      position: absolute;
      z-index: 2;
      top: max(18px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      right: max(20px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .brand, .toplinks, .profile, .controls, .hint { pointer-events: auto; }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #f0f4f5;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .28);
    }

    .mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--accent);
      font-size: 16px;
      letter-spacing: 0;
      backdrop-filter: blur(16px);
    }

    .toplinks { display: flex; gap: 8px; }

    .link, .control {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: #eef3f5;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: border-color .18s ease, background .18s ease;
    }

    .link:hover, .control:hover {
      border-color: rgba(142, 203, 193, .62);
      background: rgba(32, 49, 59, .95);
    }

    .profile {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: max(22px, env(safe-area-inset-right));
      width: min(300px, calc(100vw - 40px));
      padding: 19px;
      transform: translateY(-50%);
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .18);
      backdrop-filter: blur(20px);
    }

    .profile-kicker {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: 1.08;
    }

    .role { margin: 6px 0 0; color: #d8e0e4; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      color: #d4e2e0;
      font-size: 12px;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(142, 203, 193, .7);
      content: "";
    }

    .task {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .profile-link {
      display: inline-block;
      margin-top: 15px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .profile-link:hover { text-decoration: underline; }

    .controls {
      position: absolute;
      z-index: 2;
      left: max(20px, env(safe-area-inset-left));
      bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
    }

    .control {
      width: 42px;
      min-height: 42px;
      padding: 0;
      font-size: 17px;
    }

    .control.reset {
      width: auto;
      padding: 0 13px;
      font-size: 12px;
      font-weight: 600;
    }

    .hint {
      position: absolute;
      z-index: 2;
      right: max(22px, env(safe-area-inset-right));
      bottom: max(22px, env(safe-area-inset-bottom));
      color: rgba(234, 241, 243, .72);
      font-size: 11px;
      text-align: right;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .45);
    }

    @media (max-width: 700px) {
      .topbar { top: 12px; left: 12px; right: 12px; }
      .brand { font-size: 10px; gap: 8px; }
      .mark { width: 32px; height: 32px; }
      .link { min-height: 36px; padding: 0 9px; font-size: 11px; }
      .profile {
        top: auto;
        right: 12px;
        bottom: 76px;
        width: min(245px, calc(100vw - 24px));
        padding: 14px;
        transform: none;
      }
      h1 { font-size: 24px; }
      .role, .task { font-size: 12px; }
      .status { margin-top: 11px; }
      .task { margin-top: 8px; }
      .profile-link { margin-top: 10px; }
      .controls { left: 12px; bottom: 12px; gap: 6px; }
      .control { width: 38px; min-height: 38px; }
      .hint { right: 12px; bottom: 17px; max-width: 36vw; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Интерактивный обзор офиса агентов">
    <canvas id="office" role="img" aria-label="Офис с рабочим столом и Лизой. Перетаскивайте изображение, чтобы повернуть камеру."></canvas>

    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true">О</span> Офис агентов</div>
      <nav class="toplinks" aria-label="Навигация">
        <a class="link" href="index.html">Главная</a>
        <a class="link" href="town.html">План офиса</a>
      </nav>
    </header>

    <aside class="profile" aria-live="polite">
      <p class="profile-kicker">Комьюнити</p>
      <h1>Лиза</h1>
      <p class="role">Комьюнити-менеджер</p>
      <div class="status" id="status">В офисе</div>
      <p class="task" id="task">Следит за комментариями и готовит ответы для команды.</p>
      <a class="profile-link" href="lisa-preview.html">Посмотреть образ Лизы ↗</a>
    </aside>

    <div class="controls" aria-label="Управление видом">
      <button class="control" id="zoom-out" type="button" aria-label="Отдалить">−</button>
      <button class="control" id="zoom-in" type="button" aria-label="Приблизить">+</button>
      <button class="control reset" id="reset" type="button">Сбросить вид</button>
    </div>

    <div class="hint">Перетаскивайте, чтобы осмотреть комнату<br>Колесо мыши меняет масштаб</div>
  </main>

  <script>
    const canvas = document.querySelector("#office");
    const context = canvas.getContext("2d", { alpha: false });
    const statusElement = document.querySelector("#status");
    const taskElement = document.querySelector("#task");
    const avatar = new Image();
    avatar.src = "assets/lisa-cutout.webp";

    const viewport = { width: 0, height: 0, pixelRatio: 1 };
    const camera = {
      yaw: 0.18,
      pitch: 0.16,
      distance: 9.4,
      targetYaw: 0.18,
      targetPitch: 0.16,
      targetDistance: 9.4,
    };
    const target = [0, 1.15, 0];
    const roomFaces = [];
    let dragging = false;
    let lastPointer = null;
    let animationFrame = 0;

    function addPolygon(points, color, stroke = null) {
      roomFaces.push({ points, color, stroke });
    }

    function addBox(center, size, palette) {
      const [x, y, z] = center;
      const [width, depth, height] = size;
      const x0 = x - width / 2;
      const x1 = x + width / 2;
      const y0 = y - depth / 2;
      const y1 = y + depth / 2;
      const z0 = z;
      const z1 = z + height;

      addPolygon([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], palette.top);
      addPolygon([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], palette.front);
      addPolygon([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], palette.side);
      addPolygon([[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], palette.side);
      addPolygon([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], palette.back || palette.front);
    }

    function buildRoom() {
      addPolygon([[-4.6, -4.4, 0], [4.6, -4.4, 0], [4.6, 4.1, 0], [-4.6, 4.1, 0]], "#887a69");
      addPolygon([[-4.6, -4.4, 0], [4.6, -4.4, 0], [4.6, -4.4, 3.5], [-4.6, -4.4, 3.5]], "#d5d5ce");
      addPolygon([[-4.6, -4.4, 0], [-4.6, 4.1, 0], [-4.6, 4.1, 3.5], [-4.6, -4.4, 3.5]], "#b5b8b0");
      addPolygon([[4.6, -4.4, 0], [4.6, 4.1, 0], [4.6, 4.1, 3.5], [4.6, -4.4, 3.5]], "#8f9998");

      addPolygon([[-2.75, -4.36, 1.05], [-0.15, -4.36, 1.05], [-0.15, -4.36, 2.78], [-2.75, -4.36, 2.78]], "#9fc1ce");
      addPolygon([[-2.75, -4.34, 1.05], [-2.05, -4.34, 1.05], [-1.2, -4.34, 1.7], [-2.05, -4.34, 1.53]], "#67889b");
      addPolygon([[-2.05, -4.34, 1.05], [-1.1, -4.34, 1.05], [-1.6, -4.34, 1.82], [-2.05, -4.34, 1.53]], "#7897a5");
      addPolygon([[-1.1, -4.34, 1.05], [-0.15, -4.34, 1.05], [-0.15, -4.34, 1.65], [-0.55, -4.34, 1.47]], "#617e90");
      addBox([-1.45, -4.27, 1.88], [0.075, 0.16, 1.82], { top: "#efe8dc", front: "#eee9df", side: "#d1d4ce" });
      addBox([-1.45, -4.27, 1.05], [2.65, 0.16, 0.075], { top: "#eee9df", front: "#cbd2d2", side: "#cbd2d2" });

      addPolygon([[-1.45, -4.34, 2.96], [1.85, -4.34, 2.96], [1.85, -4.34, 3.03], [-1.45, -4.34, 3.03]], "#ded8c8");
      addPolygon([[2.15, -4.35, 1.1], [3.75, -4.35, 1.1], [3.75, -4.35, 2.62], [2.15, -4.35, 2.62]], "#e8e4da");
      addPolygon([[2.35, -4.32, 2.24], [3.55, -4.32, 2.24], [3.55, -4.32, 2.4], [2.35, -4.32, 2.4]], "#71938b");
      addPolygon([[2.35, -4.32, 2.0], [3.38, -4.32, 2.0], [3.38, -4.32, 2.07], [2.35, -4.32, 2.07]], "#afb4ac");
      addPolygon([[2.35, -4.32, 1.82], [3.18, -4.32, 1.82], [3.18, -4.32, 1.89], [2.35, -4.32, 1.89]], "#afb4ac");

      addBox([0, -0.65, 0.73], [3.15, 1.48, 0.14], { top: "#bd9168", front: "#a87852", side: "#986948" });
      addBox([-1.28, -0.55, 0], [0.14, 0.14, 0.72], { top: "#5c5046", front: "#4b4944", side: "#3e4545" });
      addBox([1.28, -0.55, 0], [0.14, 0.14, 0.72], { top: "#5c5046", front: "#4b4944", side: "#3e4545" });
      addBox([-1.28, 0.0, 0], [0.14, 0.14, 0.72], { top: "#5c5046", front: "#4b4944", side: "#3e4545" });
      addBox([1.28, 0.0, 0], [0.14, 0.14, 0.72], { top: "#5c5046", front: "#4b4944", side: "#3e4545" });

      addBox([0.4, -0.78, 0.88], [1.05, 0.16, 0.74], { top: "#4b5961", front: "#293840", side: "#202c33" });
      addPolygon([[-0.04, -0.685, 1.0], [0.84, -0.685, 1.0], [0.84, -0.685, 1.58], [-0.04, -0.685, 1.58]], "#253d49");
      addPolygon([[0.01, -0.675, 1.06], [0.79, -0.675, 1.06], [0.79, -0.675, 1.51], [0.01, -0.675, 1.51]], "#46736f");
      addBox([0.4, -0.63, 0.84], [0.13, 0.16, 0.12], { top: "#75827e", front: "#596561", side: "#505957" });
      addBox([0.4, -0.63, 0.81], [0.7, 0.34, 0.06], { top: "#596561", front: "#414a49", side: "#414a49" });

      addBox([-1.0, -0.15, 0.45], [0.86, 0.74, 0.12], { top: "#47555d", front: "#354149", side: "#2d3941" });
      addBox([-1.0, -0.58, 0.55], [0.82, 0.14, 0.87], { top: "#4f6069", front: "#3b4a53", side: "#33414a" });
      addBox([-1.0, -0.15, 0.05], [0.11, 0.11, 0.43], { top: "#5f6869", front: "#414b4d", side: "#394345" });

      addBox([-2.65, 0.25, 0], [0.54, 0.54, 0.5], { top: "#b77a58", front: "#9a6449", side: "#835743" });
      addPolygon([[-2.65, 0.25, 0.48], [-2.65, 0.25, 1.42], [-3.1, 0.25, 0.95]], "#597c65");
      addPolygon([[-2.65, 0.25, 0.52], [-2.18, 0.25, 1.18], [-2.1, 0.25, 0.86]], "#6d916f");
      addPolygon([[-2.65, 0.25, 0.48], [-2.72, 0.25, 1.28], [-2.37, 0.25, 0.9]], "#789b77");

      addPolygon([[-2.25, 0.9, 0.02], [-0.15, 0.9, 0.02], [-0.15, 2.35, 0.02], [-2.25, 2.35, 0.02]], "#a89b89");
      addPolygon([[1.55, -4.1, 0.01], [3.45, -4.1, 0.01], [3.45, -2.2, 0.01], [1.55, -2.2, 0.01]], "#a79883");
    }

    function subtract(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function dot(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
    }

    function normalize(vector) {
      const length = Math.hypot(vector[0], vector[1], vector[2]) || 1;
      return [vector[0] / length, vector[1] / length, vector[2] / length];
    }

    function cameraBasis() {
      const horizontalDistance = camera.distance * Math.cos(camera.pitch);
      const eye = [
        target[0] + Math.sin(camera.yaw) * horizontalDistance,
        target[1] + Math.cos(camera.yaw) * horizontalDistance,
        target[2] + camera.distance * Math.sin(camera.pitch),
      ];
      const forward = normalize(subtract(target, eye));
      const right = normalize(cross([0, 0, 1], forward));
      const up = normalize(cross(forward, right));
      return { eye, forward, right, up };
    }

    function project(point, basis) {
      const relative = subtract(point, basis.eye);
      const depth = dot(relative, basis.forward);
      if (depth <= 0.12) return null;

      const focalLength = Math.min(viewport.width, viewport.height) * 1.02;
      return {
        x: viewport.width / 2 + dot(relative, basis.right) * focalLength / depth,
        y: viewport.height * 0.55 - dot(relative, basis.up) * focalLength / depth,
        depth,
      };
    }

    function drawFace(face, basis) {
      const points = face.points.map(point => project(point, basis));
      if (points.some(point => point === null)) return;

      context.beginPath();
      context.moveTo(points[0].x, points[0].y);
      for (let index = 1; index < points.length; index += 1) {
        context.lineTo(points[index].x, points[index].y);
      }
      context.closePath();
      context.fillStyle = face.color;
      context.fill();
      if (face.stroke) {
        context.strokeStyle = face.stroke;
        context.stroke();
      }
    }

    function drawWindowLight(basis) {
      const points = [
        [-2.55, -4.33, 2.74],
        [-0.35, -4.33, 2.74],
        [-0.35, -4.33, 1.18],
        [-2.55, -4.33, 1.18],
      ].map(point => project(point, basis));
      if (points.some(point => point === null)) return;

      const light = context.createLinearGradient(points[0].x, points[0].y, points[2].x, points[2].y);
      light.addColorStop(0, "rgba(221, 239, 238, .2)");
      light.addColorStop(1, "rgba(221, 239, 238, 0)");
      context.beginPath();
      context.moveTo(points[0].x, points[0].y);
      for (let index = 1; index < points.length; index += 1) context.lineTo(points[index].x, points[index].y);
      context.closePath();
      context.fillStyle = light;
      context.fill();
    }

    function drawAvatar(basis) {
      if (!avatar.complete || !avatar.naturalWidth) return;

      const centerX = 2.25;
      const centerY = 0.72;
      const halfWidth = 0.72;
      const height = 2.55;
      const right = [Math.cos(camera.yaw), -Math.sin(camera.yaw), 0];
      const bottomCenter = [centerX, centerY, 0.025];
      const topCenter = [centerX, centerY, height];
      const topLeft = project([topCenter[0] - right[0] * halfWidth, topCenter[1] - right[1] * halfWidth, topCenter[2]], basis);
      const topRight = project([topCenter[0] + right[0] * halfWidth, topCenter[1] + right[1] * halfWidth, topCenter[2]], basis);
      const bottomRight = project([bottomCenter[0] + right[0] * halfWidth, bottomCenter[1] + right[1] * halfWidth, bottomCenter[2]], basis);
      const bottomLeft = project([bottomCenter[0] - right[0] * halfWidth, bottomCenter[1] - right[1] * halfWidth, bottomCenter[2]], basis);
      const corners = [topLeft, topRight, bottomRight, bottomLeft];
      if (corners.some(point => point === null)) return;

      context.save();
      context.beginPath();
      context.moveTo(topLeft.x, topLeft.y);
      context.lineTo(topRight.x, topRight.y);
      context.lineTo(bottomRight.x, bottomRight.y);
      context.lineTo(bottomLeft.x, bottomLeft.y);
      context.closePath();
      context.clip();

      const a = (topRight.x - topLeft.x) / avatar.naturalWidth;
      const b = (topRight.y - topLeft.y) / avatar.naturalWidth;
      const c = (bottomLeft.x - topLeft.x) / avatar.naturalHeight;
      const d = (bottomLeft.y - topLeft.y) / avatar.naturalHeight;
      context.setTransform(viewport.pixelRatio * a, viewport.pixelRatio * b, viewport.pixelRatio * c, viewport.pixelRatio * d, viewport.pixelRatio * topLeft.x, viewport.pixelRatio * topLeft.y);
      context.drawImage(avatar, 0, 0);
      context.restore();
      context.setTransform(viewport.pixelRatio, 0, 0, viewport.pixelRatio, 0, 0);
    }

    function draw() {
      animationFrame = 0;
      context.setTransform(viewport.pixelRatio, 0, 0, viewport.pixelRatio, 0, 0);
      const background = context.createLinearGradient(0, 0, 0, viewport.height);
      background.addColorStop(0, "#354c59");
      background.addColorStop(0.58, "#1c2b34");
      background.addColorStop(1, "#141d24");
      context.fillStyle = background;
      context.fillRect(0, 0, viewport.width, viewport.height);

      const basis = cameraBasis();
      const orderedFaces = roomFaces.map(face => {
        const averageDepth = face.points.reduce((sum, point) => sum + dot(subtract(point, basis.eye), basis.forward), 0) / face.points.length;
        return { face, averageDepth };
      }).sort((a, b) => b.averageDepth - a.averageDepth);

      orderedFaces.forEach(item => drawFace(item.face, basis));
      drawWindowLight(basis);
      drawAvatar(basis);
    }

    function scheduleDraw() {
      if (!animationFrame) animationFrame = requestAnimationFrame(draw);
    }

    function resize() {
      viewport.width = window.innerWidth;
      viewport.height = window.innerHeight;
      viewport.pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(viewport.width * viewport.pixelRatio);
      canvas.height = Math.round(viewport.height * viewport.pixelRatio);
      scheduleDraw();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    canvas.addEventListener("pointerdown", event => {
      dragging = true;
      lastPointer = [event.clientX, event.clientY];
      canvas.classList.add("dragging");
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", event => {
      if (!dragging || !lastPointer) return;
      const deltaX = event.clientX - lastPointer[0];
      const deltaY = event.clientY - lastPointer[1];
      lastPointer = [event.clientX, event.clientY];
      camera.yaw = clamp(camera.yaw + deltaX * 0.006, -1.0, 1.0);
      camera.pitch = clamp(camera.pitch - deltaY * 0.004, -0.05, 0.48);
      scheduleDraw();
    });

    function releasePointer() {
      dragging = false;
      lastPointer = null;
      canvas.classList.remove("dragging");
    }

    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);
    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      camera.distance = clamp(camera.distance + event.deltaY * 0.008, 6.5, 12.5);
      scheduleDraw();
    }, { passive: false });

    document.querySelector("#zoom-in").addEventListener("click", () => {
      camera.distance = clamp(camera.distance - 0.7, 6.5, 12.5);
      scheduleDraw();
    });
    document.querySelector("#zoom-out").addEventListener("click", () => {
      camera.distance = clamp(camera.distance + 0.7, 6.5, 12.5);
      scheduleDraw();
    });
    document.querySelector("#reset").addEventListener("click", () => {
      camera.yaw = 0.18;
      camera.pitch = 0.16;
      camera.distance = 9.4;
      scheduleDraw();
    });

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") camera.yaw = clamp(camera.yaw - 0.08, -1.0, 1.0);
      else if (event.key === "ArrowRight") camera.yaw = clamp(camera.yaw + 0.08, -1.0, 1.0);
      else if (event.key === "ArrowUp") camera.pitch = clamp(camera.pitch + 0.06, -0.05, 0.48);
      else if (event.key === "ArrowDown") camera.pitch = clamp(camera.pitch - 0.06, -0.05, 0.48);
      else return;
      scheduleDraw();
    });

    fetch("status.json")
      .then(response => response.ok ? response.json() : null)
      .then(state => {
        const lisa = state?.agents?.community;
        if (!lisa) return;
        const labels = { working: "Работает", waiting: "Ждёт ответа", idle: "Отдыхает", error: "Нужна проверка" };
        statusElement.textContent = labels[lisa.status] || "В офисе";
        if (lisa.task) taskElement.textContent = lisa.task;
      })
      .catch(() => {});

    buildRoom();
    avatar.addEventListener("load", scheduleDraw);
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
