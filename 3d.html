<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Офис gusevmade · 3D</title>
<meta name="theme-color" content="#14181d">
<style>
:root{--ink:#eef2f6;--muted:#a9b4c2;--panel:rgba(18,22,28,.78);--line:rgba(255,255,255,.12);--ok:#53c287;--warn:#e3a341;--bad:#e2675f;--idle:#8995a3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#14181d;color:var(--ink);font-family:Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
.top{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.brand{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.brand b{display:block;font-size:16px}
.brand span{font-size:12px;color:var(--muted)}
.views{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.views button,.views a{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;text-decoration:none}
.views button[aria-pressed="true"]{background:#2f6f73}
.tag{transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;text-align:center}
.tag .n{display:inline-flex;align-items:center;gap:6px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}
.tag .n i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.tag .t{display:block;max-width:220px;margin:4px auto 0;font-size:11px;color:var(--muted);white-space:normal;line-height:1.3;background:rgba(15,20,26,.6);border-radius:8px;padding:3px 7px}
.s-working i{background:var(--ok)!important;animation:p 1s infinite}.s-waiting i{background:var(--warn)!important}.s-error i{background:var(--bad)!important;animation:p .6s infinite}
@keyframes p{50%{opacity:.3}}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
.foot{position:fixed;left:16px;bottom:max(12px,env(safe-area-inset-bottom));font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
@media (max-width:600px){.tag .t{display:none}.brand span{display:none}.views button,.views a{padding:7px 10px;font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>

const floorTex=canvasTex(1024,1024,(g)=>{for(let r=0;r<32;r++){for(let c=0;c<5;c++){const off=(r%2)*128;const v=150+((r*7+c*13)%5)*8;g.fillStyle=`rgb(${v+40},${v+5},${v-35})`;g.fillRect(c*256+off-256,r*32,256,32);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(c*256+off-256,r*32,2,32);}g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,r*32,1024,1);}});

 ridge('#a9bccd',190,120,1);ridge('#8aa3b8',230,90,3);ridge('#cfa63c',280,45,5);ridge('#6f8f45',320,28,7);});

 [[0,1.0,0,.42],[.18,1.25,.08,.3],[-.16,1.3,-.06,.28],[.02,1.55,.02,.24]].forEach(([a,b,c,r])=>{const l=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),MAT.plant);l.position.set(a,b,c);l.castShadow=true;g.add(l);});cyl(.025,.03,.7,MAT.walnut,0,.75,0,g);}
plant(-14,-10); plant(14.2,-6.8); plant(-14.2,9.9,.9); plant(-13.8,-2.6,.8); plant(14,9.8);

 for(let i=0;i<5;i++){const a=i/5*Math.PI*2;const leg=box(.3,.03,.04,MAT.metal,Math.sin(a)*.15,.04,Math.cos(a)*.15,g);leg.rotation.y=a+Math.PI/2;}
 if(exec){box(.06,.06,.4,mat,-.29,.67,-.02,g);box(.06,.06,.4,mat,.29,.67,-.02,g);} return g;}

 const mat=new THREE.MeshBasicMaterial({map:tex,toneMapped:false});const s={kind,c,g:c.getContext('2d'),tex,mat,on:true,bright:1,t:Math.random()*10};screens.push(s);drawScreen(s,0);return s;}

 const W=wide?.78:.62,H=wide?.42:.36;box(W+.04,H+.04,.03,MAT.black,0,.3+H/2,0,g);const s=screen(kind,W,H);
 const p=new THREE.Mesh(new THREE.PlaneGeometry(W,H),s.mat);p.position.set(0,.3+H/2,.017);g.add(p);
 box(.04,.3,.04,MAT.metal,0,.15,-.03,g);box(.22,.015,.16,MAT.metal,0,.008,-.02,g);return s;}
function keyboard(x,y,z,ry,parent=scene){const k=box(.44,.02,.14,MAT.black,x,y,z,parent);k.rotation.y=ry;const m=box(.06,.02,.1,MAT.black,x+.3,y,z,parent);m.rotation.y=ry;}

function drawScreen(s,t){const g=s.g,W=s.c.width,H=s.c.height;const k=s.kind;const dim=s.on?1:.25;
 g.globalAlpha=1;g.fillStyle='#0f141b';g.fillRect(0,0,W,H);

 g.fillStyle='#1c2430';g.fillRect(0,0,W,22);['#e2675f','#e3a341','#53c287'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(14+i*16,11,5,0,7);g.fill();});

  const off=Math.floor(t*2)%lines.length;for(let i=0;i<9;i++){const l=lines[(i+off)%lines.length];g.fillStyle=['#c792ea','#82aaff','#c3e88d','#f78c6c'][i%4];g.font='500 19px monospace';g.textAlign='left';g.fillText(l.slice(0,Math.min(l.length,i===8?Math.floor((t*12)%l.length):99)),18,48+i*26);} }
 else if(k==='insta'){g.fillStyle='#fff';g.fillRect(0,22,W,H-22);text(g,'gusevmade',20,44,20,'#111',800);const cols=['#f2c46b','#8cc7a1','#7fb6d6','#e07b4f','#b08ce0','#5e8c4a'];for(let i=0;i<6;i++){g.fillStyle=cols[(i+Math.floor(t/2))%6];g.fillRect(20+(i%3)*160,64+Math.floor(i/3)*110,150,100);} }
 else if(k==='video'){g.fillStyle='#222b36';g.fillRect(14,30,W*.62,H*.55);const gr=g.createLinearGradient(0,30,0,30+H*.55);gr.addColorStop(0,'#7fb8e6');gr.addColorStop(1,'#cfa63c');g.fillStyle=gr;g.fillRect(18,34,W*.62-8,H*.55-8);
  g.fillStyle='#6f8f45';g.beginPath();g.moveTo(18,30+H*.55-4);for(let x=0;x<W*.62-8;x+=10)g.lineTo(18+x,30+H*.4+Math.sin(x*.05+t)*10);g.lineTo(18+W*.62-8,30+H*.55-4);g.fill();
  g.fillStyle='#2a3340';g.fillRect(W*.66,30,W*.32,H*.55);for(let i=0;i<4;i++){g.fillStyle=['#e07b4f','#b08ce0','#53c287','#7fb6d6'][i];g.fillRect(W*.68,40+i*26,W*.28,18);}
  const ty=H*.66;for(let r=0;r<3;r++){g.fillStyle='#1c2430';g.fillRect(14,ty+r*24,W-28,18);for(let i=0;i<5;i++){g.fillStyle=['#e07b4f','#b08ce0','#53c287','#f2c46b','#7fb6d6'][(i+r)%5];g.fillRect(20+i*92+r*14,ty+r*24+2,80,14);}}
  const px=14+((t*60)%(W-28));g.fillStyle='#fff';g.fillRect(px,ty-6,2,80);}
 else if(k==='chart'){g.strokeStyle='#2a3340';for(let i=0;i<5;i++){g.beginPath();g.moveTo(20,50+i*40);g.lineTo(W-20,50+i*40);g.stroke();}
  for(let i=0;i<10;i++){const v=40+((i*37+Math.floor(t))%7)*18;g.fillStyle=i%2?'#3c6fb0':'#5b8fd6';g.fillRect(30+i*46,H-24-v,30,v);}
  g.strokeStyle='#e2675f';g.lineWidth=3;g.beginPath();for(let i=0;i<10;i++){const y=H-80-i*12-Math.sin(i+t)*8;i?g.lineTo(45+i*46,y):g.moveTo(45,y);}g.stroke();g.lineWidth=1;text(g,'охват +12%',W-24,40,20,'#53c287',800,'right');}
 else if(k==='map'){g.fillStyle='#1d2a24';g.fillRect(0,22,W,H-22);g.strokeStyle='#3d5a4c';for(let i=0;i<8;i++){g.beginPath();g.arc(W*.4,H*.6,30+i*28,0,7);g.stroke();}
  for(let i=0;i<6;i++){const a=i+t*.3;const x=W*.4+Math.cos(a)*(60+i*25),y=H*.6+Math.sin(a*1.3)*(40+i*12);g.fillStyle=['#e2675f','#f2c46b','#53c287'][i%3];g.beginPath();g.arc(x,y,7,0,7);g.fill();}

 else if(k==='tube'){text(g,'Видео · Бабушкина дача',20,44,20,'#eef2f6',800);const views=12480+Math.floor(t*7);text(g,views.toLocaleString('ru-RU')+' просмотров',W-20,44,18,'#53c287',800,'right');
  const cols=['#f2c46b','#8cc7a1','#7fb6d6','#e07b4f','#b08ce0','#e2675f'];const cw=(W-50)/3,ch=(H-110)/2;

  ['VK Видео','YouTube','RUTUBE','RuStore'].forEach((n,i)=>{const x=16+i*((W-32)/4);rr(g,x,H-38,(W-32)/4-8,26,13);g.fillStyle='#232c38';g.fill();text(g,n,x+((W-32)/4-8)/2,H-25,15,'#dfe6ee',700,'center');});}
 else if(k==='dash'){text(g,'Офис · сегодня',20,46,22,'#eef2f6',800);const items=[['Рилсы',.66,'#53c287'],['Подписчики',.12,'#e3a341'],['Переходы',.05,'#7fb6d6']];items.forEach(([n,v,c],i)=>{text(g,n,20,88+i*44,18,'#a9b4c2',600);g.fillStyle='#232c38';g.fillRect(170,78+i*44,W-200,16);g.fillStyle=c;g.fillRect(170,78+i*44,(W-200)*Math.min(1,v+.02*Math.sin(t)),16);});}
 g.globalAlpha=1;s.tex.needsUpdate=true;}

// ---------- открытое пространство: команда ----------
const TEAM=[{k:'poster',name:'Макс',role:'контент',x:-7.2,screen:'code',screen2:'insta'},{k:'editor',name:'Артём',role:'монтаж',x:-2.4,screen:'video',screen2:'video'},{k:'analyst',name:'Вера',role:'аналитик',x:2.4,screen:'chart'},{k:'scout',name:'Тимур',role:'тренды',x:7.2,screen:'map'}];
const DZ=-6.2; const teamScreens={};
TEAM.forEach(t=>{
 box(1.9,.05,.95,MAT.oak,t.x,.75,DZ); [[-.88,-.42],[.88,-.42],[-.88,.42],[.88,.42]].forEach(([dx,dz])=>box(.05,.73,.05,MAT.metal,t.x+dx,.365,DZ+dz));

 const lampG=new THREE.Group();lampG.position.set(t.x-.78,.775,DZ-.25);scene.add(lampG);cyl(.08,.08,.02,MAT.black,0,.01,0,lampG);cyl(.012,.012,.4,MAT.black,0,.2,0,lampG,8);const sh=cyl(.03,.09,.1,MAT.black,0,.42,.05,lampG);sh.rotation.x=.5;

 const pl=new THREE.Mesh(new THREE.PlaneGeometry(.9,.2),new THREE.MeshBasicMaterial({map:canvasTex(512,114,(g,w,h)=>{g.fillStyle='#ffffff';g.fillRect(0,0,w,h);text(g,t.name+' · '+t.role,w/2,h/2,52,'#1b2530',800,'center');})}));

});

for(let i=0;i<14;i++) box(.25,.3+(i%3)*.05,.06,[M(0xb5562a),M(0x2f6f73),M(0xe3a341),M(0x3c6fb0)][i%4],-14.55,.47+Math.floor(i/7)*.45,-8.5+(i%7)*.13);

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function posePerson(P,t){const typing=P.typing;const s=P.mode==='sit';const ph=P.walkT;
 let hip,neckP,headP,sh=[],el=[],ha=[],hp=[],kn=[],an=[];
 if(s){const lean=typing?.06:.0;const bob=typing?Math.sin(t*1.4+P.t)*.008:Math.sin(t*.8+P.t)*.004;
  hip=V(0,.56,-.02);neckP=V(0,1.08,.05+lean);headP=V(0,1.25+bob,.08+lean*1.3);
  sh=[V(-.2,1.02,.03+lean),V(.2,1.02,.03+lean)];
  const tl=typing?Math.max(0,Math.sin(t*14+P.t))*.02:0,tr=typing?Math.max(0,Math.sin(t*14+P.t+2))*.02:0;
  if(P.restHands){el=[V(-.26,.8,.12),V(.26,.8,.12)];ha=[V(-.12,.72,.32),V(.12,.72,.32)];}
  else {el=[V(-.27,.83,.2),V(.27,.83,.2)];ha=[V(-.14,.82+tl,.47),V(.14,.82+tr,.47)];}
  hp=[V(-.1,.54,0),V(.1,.54,0)];kn=[V(-.11,.54,.44),V(.11,.54,.44)];an=[V(-.11,.09,.48),V(.11,.09,.48)];}
 else {const sw=Math.sin(ph)*.5;const lift=Math.abs(Math.cos(ph))*.02;
  hip=V(0,.94+lift,0);neckP=V(0,1.5+lift,0);headP=V(0,1.66+lift,.01);
  sh=[V(-.21,1.45+lift,0),V(.21,1.45+lift,0)];el=[V(-.25,1.18+lift,-sw*.15),V(.25,1.18+lift,sw*.15)];ha=[V(-.26,.94+lift,-sw*.3),V(.26,.94+lift,sw*.3)];
  hp=[V(-.1,.92+lift,0),V(.1,.92+lift,0)];kn=[V(-.1,.5,sw*.22+.03),V(.1,.5,-sw*.22+.03)];an=[V(-.1,.09+Math.max(0,sw)*.06,sw*.32),V(.1,.09+Math.max(0,-sw)*.06,-sw*.32)];}
 const mid=hip.clone().lerp(neckP,.5);P.torso.position.copy(mid);tv.subVectors(neckP,hip);P.torso.quaternion.setFromUnitVectors(Y,tv.clone().normalize());
 P.neck.position.copy(neckP).lerp(headP,.35);P.head.position.copy(headP);P.head.rotation.x=s&&typing?.12:0;
 const set=(m,a,b)=>{tv.subVectors(b,a);const L=tv.length();m.position.copy(a).addScaledVector(tv,.5);m.quaternion.setFromUnitVectors(Y,tv.normalize());m.scale.set(1,L/1.0,1);};
 // CapsuleGeometry(r,1): длина цилиндрической части 1 → масштаб по Y = L; капы растягиваются незаметно на таких размерах
 set(P.L.thighL,hp[0],kn[0]);set(P.L.thighR,hp[1],kn[1]);set(P.L.shinL,kn[0],an[0]);set(P.L.shinR,kn[1],an[1]);
 set(P.L.upL,sh[0],el[0]);set(P.L.upR,sh[1],el[1]);set(P.L.foreL,el[0],ha[0]);set(P.L.foreR,el[1],ha[1]);
 P.handL.position.copy(ha[0]);P.handR.position.copy(ha[1]);P.shoeL.position.copy(an[0]).add(V(0,-.05,.06));P.shoeR.position.copy(an[1]).add(V(0,-.05,.06));
 P.label.position.set(0,s?1.62:2.0,0);}

const patrol=[V(GX-1.8,0,GZ-1.8),V(GX+2.2,0,GZ-1.8),V(GX+2.2,0,GZ+.2),V(GX-1.8,0,GZ+.2)];let pi=0;
const toBoss=[V(-7.2,0,-4.2),V(-.2,0,.2),V(0,0,2.6),V(0,0,3.95)];
function walkTo(P,target,dt,speed=1.1){const pos=P.g.position;tv.subVectors(target,pos);tv.y=0;const d=tv.length();if(d<.06)return true;
 const ang=Math.atan2(tv.x,tv.z);P.g.rotation.y+=((ang-P.g.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI)*Math.min(1,dt*6);pos.addScaledVector(tv.normalize(),Math.min(d,speed*dt));P.walkT+=dt*speed*5.5;return false;}
let state={agents:{},draft:null};
function update(dt,t){
 for(const [k,P] of Object.entries(people)){
  const st=(state.agents||{})[k]||{};const s=k==='owner'?'idle':(st.status||'idle');
  P.typing= k==='owner' ? true : (s==='working'||s==='waiting'||Math.sin(t*.25+P.t)>.1);
  P.restHands=!P.typing;
  if(k==='guard'&&s==='working'){P.mode='walk';if(walkTo(P,patrol[pi],dt,.9))pi=(pi+1)%patrol.length;}
  else if(k==='poster'&&state.draft&&state.draft.status==='waiting'){
   P.cyc=(P.cyc||0)+dt;const phase=P.cyc%40;P.route=P.route||0;
   if(phase<18){if(P.route<toBoss.length){P.mode='walk';if(walkTo(P,toBoss[P.route],dt))P.route++;}else{P.mode='stand';P.g.rotation.y=0;}}
   else{if(P.route>0){P.mode='walk';if(walkTo(P,toBoss[P.route-1],dt))P.route--;}else{P.mode='walk';if(walkTo(P,P.home,dt)){P.mode='sit';P.g.rotation.y=P.homeRy;}}}
  }
  else if(P.mode!=='sit'){P.mode='walk';if(walkTo(P,P.home,dt,1.2)){P.mode='sit';P.g.rotation.y=P.homeRy;P.route=0;}}
  if(P.mode==='stand'){P.walkT=0;}
  posePerson(P,t);
 }
}
const STATUS={working:'Работает',waiting:'Ждёт вас',idle:'Отдыхает',error:'Нужна помощь'};
function applyState(){
 for(const [k,P] of Object.entries(people)){const el=P.label.element;const st=(state.agents||{})[k]||{};
  let s=st.status||'idle',txt=st.task||'';
  if(k==='owner'){const d=state.draft;s=d&&d.status==='waiting'?'waiting':'idle';txt=s==='waiting'?'Черновик ждёт вашего решения':'Всё под контролем';}
  el.className='tag s-'+s;el.querySelector('.t').textContent=(STATUS[s]||'')+(txt?' · '+txt:'');}
 const anyErr=Object.values(state.agents||{}).some(a=>a.status==='error');const c=anyErr?0xe2675f:0x53c287;lampMat.color.setHex(c);lampMat.emissive.setHex(c);lampLight.color.setHex(c);
 for(const t of TEAM){const st=(state.agents||{})[t.k]||{};(teamScreens[t.k]||[]).forEach(s=>{s.on=st.status!=='error';});}
 {const st=(state.agents||{}).video||{};[angS1,angS2].forEach(s=>{s.on=st.status!=='error';});}
 document.getElementById('upd').textContent=state.updated_at?'Обновлено: '+new Date(state.updated_at).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';}

function render(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
